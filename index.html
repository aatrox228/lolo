<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>رسالة سرية</title>
<style>
:root{--bg:#fde6ef;--card:rgba(255,246,250,.94);--text:#4a1f33;--muted:#a05a78;--accent:#e0295a;--border:#f2bcd2}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:var(--bg);color:var(--text);font-family:"Segoe UI",Tahoma,Arial,sans-serif}
.card{width:100%;max-width:520px;background:var(--card);border:1px solid var(--border);border-radius:16px;padding:28px;box-shadow:0 10px 30px rgba(190,60,110,.22)}
h1{margin:0 0 6px;font-size:1.5rem}
p.sub{margin:0 0 20px;color:var(--muted);font-size:.95rem}
label{display:block;margin:14px 0 6px;font-size:.9rem;color:var(--muted)}
textarea,input{width:100%;padding:12px;border:1px solid var(--border);border-radius:10px;background:var(--bg);color:var(--text);font:inherit}
textarea{min-height:140px;resize:vertical}
button{margin-top:16px;width:100%;padding:12px;border:0;border-radius:10px;background:var(--accent);color:#fff;font:inherit;font-weight:600;cursor:pointer}
button.alt{background:transparent;color:var(--accent);border:1px solid var(--accent);margin-top:10px}
.msg{white-space:pre-wrap;line-height:1.9;background:var(--bg);border-radius:10px;padding:16px;margin-top:10px}
.err{color:#c0392b;margin-top:10px;min-height:1.2em;font-size:.9rem}
.out{margin-top:18px;display:none}
.hidden{display:none}

/* ===== الظرف ===== */
.env-wrap{perspective:900px;margin:44px 0 6px}
.env{position:relative;width:60%;margin:0 auto;aspect-ratio:10/7;border-radius:20px;border:1px solid #d99ab7;background:linear-gradient(135deg,#f8c8dc,#e9b5cd);box-shadow:0 8px 20px rgba(160,70,110,.22);cursor:pointer;transition:transform .2s}
.env:hover{transform:translateY(-2px)}
.env .paper{position:absolute;left:9%;right:9%;top:10%;height:72%;background:#fff;border-radius:10px;box-shadow:0 2px 6px rgba(0,0,0,.1);z-index:1;transition:transform .7s .35s ease;display:flex;flex-direction:column;gap:9px;padding:16px 14px}
.env .paper i{display:block;height:5px;border-radius:3px;background:#f3dbe6}
.env .paper i:nth-child(2){width:80%}.env .paper i:nth-child(3){width:60%}
.env .pocket{position:absolute;inset:0;border-radius:0 0 20px 20px;background:linear-gradient(160deg,#f6bfd6,#e6add0);clip-path:polygon(0 30%,50% 62%,100% 30%,100% 100%,0 100%);z-index:2}
.env .flap{position:absolute;top:0;left:0;width:100%;height:56%;background:#fcc7dd;clip-path:polygon(0 0,100% 0,50% 100%);border-radius:20px 20px 0 0;transform-origin:top;transition:transform .6s ease,z-index 0s .3s;z-index:3;backface-visibility:visible}
.env .seal{position:absolute;left:50%;top:56%;width:48px;height:48px;margin:-24px 0 0 -24px;border-radius:50%;background:#fff;box-shadow:0 3px 8px rgba(160,70,110,.35);display:flex;align-items:center;justify-content:center;z-index:4;transition:opacity .3s,transform .3s}
.env.open .flap{transform:rotateX(180deg);z-index:0}
.env.open .paper{transform:translateY(-42%)}
.env.open .seal{opacity:0;transform:scale(.4);pointer-events:none}
.env.open{cursor:default}.env.open:hover{transform:none}
.hint{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:16px;color:var(--muted);font-size:.9rem}
#pwBox{margin-top:8px}
.hint.hidden{display:none}

.env-wrap{transition:padding-top .5s ease}
.env .paper{transition:transform .7s .35s ease,opacity .3s}
.env.read .paper{opacity:0}
.letter-clip{position:absolute;left:-30%;width:160%;bottom:100%;height:0;overflow:hidden;z-index:1;cursor:default}
.letter{position:absolute;left:0;right:0;bottom:0;max-height:60vh;overflow:auto;background:#fff;color:#2a2622;border-radius:12px;padding:22px 20px;box-shadow:0 4px 14px rgba(160,70,110,.25);border:1px solid #f3dbe6;transform:translateY(110%);transition:transform .9s .5s cubic-bezier(.2,.8,.25,1)}
.letter.show{transform:translateY(0)}
#letterText{white-space:pre-wrap;line-height:1.95;font-size:1.05rem}

/* ===== خلفية زهرية بقلوب ===== */

/* ===== مربع الرسالة على شكل قلب أحمر ===== */
.heart-wrap{width:100%;max-width:400px;margin:6px auto 0;filter:drop-shadow(0 8px 10px rgba(150,0,30,.35))}
.heart-box{position:relative;width:100%;aspect-ratio:1/.92;background:linear-gradient(145deg,#ff4d6d,#d90429 60%,#b8001f);-webkit-clip-path:url(#heartClip);clip-path:url(#heartClip)}
.heart-box textarea{position:absolute;left:21%;right:21%;top:24%;bottom:30%;width:auto;min-height:0;padding:4px;border:0;border-radius:0;background:transparent;color:#fff;text-align:center;resize:none;outline:none;caret-color:#fff;line-height:1.7;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.6) transparent}
.heart-box textarea::placeholder{color:rgba(255,255,255,.75)}
input:focus{outline:2px solid #ff7fa8;outline-offset:1px}

/* ===== الرسالة الخارجة من الظرف على شكل قلب أحمر ===== */
.letter-clip{filter:drop-shadow(0 6px 8px rgba(150,0,30,.35))}
.letter{aspect-ratio:1/.92;max-height:none;overflow:visible;padding:0;border:0;box-shadow:none;border-radius:0;color:#fff;background:linear-gradient(145deg,#ff4d6d,#d90429 60%,#b8001f);-webkit-clip-path:url(#heartClip);clip-path:url(#heartClip)}
.letter .lbox{position:absolute;left:21%;right:21%;top:24%;bottom:30%;overflow:auto;display:flex;flex-direction:column;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.6) transparent}
#letterText{margin:auto;text-align:center;color:#fff;font-size:clamp(.85rem,3.4vw,1.05rem);line-height:1.8}
.warn{margin-top:12px;padding:12px;border-radius:10px;background:#fff0c9;color:#6b4a00;font-size:.88rem;line-height:1.7}
.warn.hidden{display:none}
.qr-box{background:#fff;border-radius:14px;padding:12px;width:fit-content;margin:8px auto 0;box-shadow:0 4px 12px rgba(190,60,110,.2)}
.qr-box img{display:block;width:min(260px,68vw);height:auto;image-rendering:pixelated}
</style>

<div class="card">

  <!-- وضع الكتابة -->
  <div id="writeView">
    <h1>✉️ اكتبي رسالة سرية</h1>
    <p class="sub">اكتبي رسالتك وضعي لها كلمة سر، ثم أرسلي رمز QR للشخص وأخبريه بكلمة السر.</p>
    <label for="text">الرسالة</label>
    <div class="heart-wrap"><div class="heart-box"><textarea id="text" placeholder="اكتبي رسالتك هنا ♥"></textarea></div></div>
    <label for="pw">كلمة السر</label>
    <input id="pw" type="text" placeholder="مثال: وردة١٢٣">
    <button id="lockBtn">🔒 تشفير وإنشاء رمز QR</button>
    <div class="err" id="writeErr"></div>
    <div class="warn hidden" id="hostWarn"></div>
    <div class="out" id="out">
      <label>رمز QR — دعيها تمسحه بكاميرا الجوال:</label>
      <div class="qr-box"><img id="qrImg" alt="رمز QR للرسالة السرية"></div>
      <button class="alt" id="saveQr">💾 حفظ الصورة</button>
    </div>
  </div>

  <!-- وضع القراءة -->
  <div id="readView" class="hidden">
    <h1>🔒 رسالة سرية لكِ</h1>
    <p class="sub">افتحي الظرف ثم أدخلي كلمة السر لقراءة الرسالة.</p>

    <div class="env-wrap" id="envWrap">
      <div class="env" id="env">
        <div class="paper"><i></i><i></i><i></i></div>
        <div class="pocket"></div>
        <div class="flap"></div>
        <div class="letter-clip" id="letterClip"><div class="letter" id="letter"><div class="lbox"><div id="letterText"></div></div></div></div>
        <div class="seal">
          <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path fill="#ff5c8d" d="M12 21s-7.5-4.6-9.5-9.2C1.2 8.5 3 5.5 6.2 5.5c2 0 3.5 1.1 4.3 2.5.3.5.7.5 1 0 .8-1.4 2.3-2.5 4.3-2.5 3.2 0 5 3 3.7 6.3C19.5 16.4 12 21 12 21z"/></svg>
        </div>
      </div>
    </div>
    <div class="hint" id="hint">
      <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><g fill="#f48fb1"><circle cx="12" cy="6" r="4"/><circle cx="18" cy="11" r="4"/><circle cx="16" cy="18" r="4"/><circle cx="8" cy="18" r="4"/><circle cx="6" cy="11" r="4"/></g><circle cx="12" cy="12" r="3.2" fill="#ff5c8d"/></svg>
      <span>اضغطي لتفتحي الظرف</span>
    </div>

    <div id="pwBox" class="hidden">
      <input id="rpw" type="password" placeholder="كلمة السر">
      <button id="openBtn">فتح الرسالة</button>
      <div class="err" id="readErr"></div>
    </div>
  </div>

</div>

<script>
const enc = new TextEncoder(), dec = new TextDecoder();
const $ = id => document.getElementById(id);

const b64 = buf => btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const unb64 = s => {
  s = s.replace(/-/g,'+').replace(/_/g,'/');
  while (s.length % 4) s += '=';
  return Uint8Array.from(atob(s), c => c.charCodeAt(0));
};

async function deriveKey(password, salt){
  const base = await crypto.subtle.importKey('raw', enc.encode(password), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey(
    {name:'PBKDF2', salt, iterations:200000, hash:'SHA-256'},
    base, {name:'AES-GCM', length:256}, false, ['encrypt','decrypt']
  );
}

async function encrypt(text, password){
  const salt = crypto.getRandomValues(new Uint8Array(16));
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const key = await deriveKey(password, salt);
  const ct = await crypto.subtle.encrypt({name:'AES-GCM', iv}, key, enc.encode(text));
  const all = new Uint8Array(28 + ct.byteLength);
  all.set(salt, 0); all.set(iv, 16); all.set(new Uint8Array(ct), 28);
  return b64(all);
}

async function decrypt(payload, password){
  const all = unb64(payload);
  const key = await deriveKey(password, all.slice(0,16));
  const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv: all.slice(16,28)}, key, all.slice(28));
  return dec.decode(pt);
}

// عند تغيير الرابط (لصق رابط جديد في نفس التبويب) أعد تحميل الصفحة
window.addEventListener('hashchange', () => location.reload());

// تحديد الوضع حسب الرابط
const payload = location.hash.slice(1);
if (payload) {
  $('writeView').classList.add('hidden');
  $('readView').classList.remove('hidden');
}

function showHostWarn(){
  let msg = '';
  if (!(window.crypto && crypto.subtle)) {
    msg = '⚠️ هذا المتصفح لا يسمح بالتشفير في هذه الصفحة. افتحيها عبر رابط يبدأ بـ https:// (بعد رفع الملف على موقع استضافة) وليس من ملف محفوظ على الجوال.';
  } else if (location.protocol === 'file:') {
    msg = '⚠️ أنتِ تفتحين الملف من جهازك، لذلك رمز QR سيعمل على هذا الجهاز فقط. لكي يمسحه الشخص الآخر ويفتح الرسالة في جواله، ارفعي هذا الملف على موقع استضافة (مثل Netlify Drop أو GitHub Pages) ثم أنشئي الرمز من هناك.';
  }
  $('hostWarn').textContent = msg;
  $('hostWarn').classList.toggle('hidden', !msg);
}
showHostWarn();

function qrDataURL(text){
  let qr = null;
  for (const lvl of [QRErrorCorrectLevel.M, QRErrorCorrectLevel.L]) {
    try { qr = new QRCodeLib(-1, lvl); qr.addData(text); qr.make(); break; } catch(e){ qr = null; }
  }
  if (!qr) throw new Error('too-long');
  const n = qr.getModuleCount(), quiet = 4;
  const scale = Math.max(4, Math.floor(720 / (n + 2*quiet)));
  const size = (n + 2*quiet) * scale;
  const cv = document.createElement('canvas'); cv.width = cv.height = size;
  const cx = cv.getContext('2d');
  cx.fillStyle = '#fff'; cx.fillRect(0, 0, size, size);
  cx.fillStyle = '#2a0f1c';

}

$('lockBtn').onclick = async () => {
  const text = $('text').value.trim(), pw = $('pw').value;
  $('writeErr').textContent = '';
  if (!text || !pw) { $('writeErr').textContent = 'اكتبي الرسالة وكلمة السر أولاً.'; return; }
  try {
    const data = await encrypt(text, pw);
    const url = location.href.split('#')[0] + '#' + data;
    $('qrImg').src = qrDataURL(url);
    $('out').style.display = 'block';
  } catch(e){
    $('out').style.display = 'none';
    $('writeErr').textContent = e.message === 'too-long'
      ? 'الرسالة طويلة جداً لرمز QR، اختصريها قليلاً.'
      : 'حدث خطأ أثناء التشفير.';
  }
};

$('saveQr').onclick = () => {
  const a = document.createElement('a');
  a.href = $('qrImg').src; a.download = 'secret-message-qr.png';
  document.body.appendChild(a); a.click(); a.remove();
};

async function openMsg(){
  $('readErr').textContent = '';
  try {
    const text = await decrypt(payload, $('rpw').value);
    $('pwBox').classList.add('hidden');
    $('letterText').textContent = text;
    const h = $('letter').offsetHeight;
    $('letterClip').style.height = (h + 16) + 'px';
    $('envWrap').style.paddingTop = (h + 8) + 'px';
    $('env').classList.add('read');
    requestAnimationFrame(() => $('letter').classList.add('show'));
  } catch(e){ $('readErr').textContent = (window.crypto && crypto.subtle) ? 'كلمة السر غير صحيحة ❌' : 'المتصفح لا يدعم فتح الرسالة هنا. افتحي الرابط في Chrome أو Safari مباشرة.'; }
}
$('openBtn').onclick = openMsg;
$('env').onclick = () => {
  if ($('env').classList.contains('open')) return;
  $('env').classList.add('open');
  $('hint').classList.add('hidden');
  $('pwBox').classList.remove('hidden');
  setTimeout(() => $('rpw').focus(), 400);
};
$('rpw').addEventListener('keydown', e => { if (e.key === 'Enter') openMsg(); });
